name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['22.23.3', '26.13.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: npm test

      - name: Package file list
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          GOT=$(jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json" | LC_ALL=C sort)
          WANT=$(printf '%s\n' LICENSE README.md RELEASE-NOTES.md bin/brewpage.js package.json src/api.js src/cli.js src/receipts.js)
          if [[ "$GOT" != "$WANT" ]]; then
            echo "::error::npm pack file list differs"
            diff <(echo "$WANT") <(echo "$GOT") || true
            exit 1
          fi
